<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCADO LIBRE HV</title>
    <style>
        /* Tipografía y reset básico estilo Meli */
        body { 
            margin: 0; 
            font-family: "Proxima Nova", -apple-system, Roboto, Arial, sans-serif; 
            background-color: #ebebeb; 
            color: #333333; 
        }
        
        /* Barra superior amarilla oficial */
        .header-meli { 
            background-color: #ffe600; 
            height: 56px; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
        }
        .header-meli .menu-icon { font-size: 24px; margin-right: 15px; cursor: pointer; }
        .header-meli .logo-text { font-weight: 900; font-size: 18px; color: #2d3277; letter-spacing: -0.5px;}

        /* Contenedor principal */
        .main-container { padding: 24px; max-width: 800px; margin: 0 auto; }
        
        /* Breadcrumb (Navegación) */
        .breadcrumb { font-size: 14px; color: #3483fa; margin-bottom: 20px; cursor: pointer; }
        
        /* Título de la página */
        .page-title { font-size: 24px; font-weight: 600; margin-top: 0; margin-bottom: 24px; color: #333; }

        /* Estilo de las tarjetas (Cards) del WMS */
        .card { 
            background: #ffffff; 
            border-radius: 6px; 
            padding: 24px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
            border: 1px solid #e6e6e6;
            margin-bottom: 20px;
        }

        /* Inputs de texto */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #4a4a4a; }
        .input-meli { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 14px 16px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: border-color 0.2s, box-shadow 0.2s; 
            outline: none;
        }
        .input-meli:focus { 
            border-color: #3483fa; 
            box-shadow: 0 0 0 2px rgba(52,131,250,0.2); 
        }

        /* Botón primario Meli */
        .btn-primary {
            width: 100%;
            background-color: #3483fa;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 24px;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #2968c8; }

        /* Etiquetas de los productos pendientes */
        .lista-items { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
        .item-badge {
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            color: #666;
        }

        /* Textos dinámicos */
        .oculto { display: none !important; }
        .status-text { margin-top: 12px; font-size: 15px; }
        .info-highlight { color: #3483fa; font-weight: 600; }
        .exito { color: #00a650; font-weight: 600; font-size: 18px; }
        .error { color: #f23d4f; font-weight: 600; font-size: 18px; }
        
        /* Divisor interior */
        hr { border: 0; border-top: 1px solid #eeeeee; margin: 24px 0; }
    </style>
</head>
<body>

<!-- Header amarillo -->
<div class="header-meli">
    <div class="menu-icon">☰</div>
    <div class="logo-text">MERCADO LIBRE | HV</div>
</div>

<div class="main-container">
    <div class="breadcrumb" id="btn-breadcrumb">Volver a inicio > Auditoría High Value</div>
    
    <h1 class="page-title">Validación de Contenedor</h1>

    <!-- FASE 1: Escaneo del Tote -->
    <div class="card" id="fase-tote">
        <div class="form-group">
            <label>1. Escanea el código del MU (Tote):</label>
            <input type="text" id="input-mu" class="input-meli" placeholder="Ej. MU-TT-RC-2A0-812" autofocus>
        </div>
        <div id="mensaje-sistema" class="status-text"></div>
    </div>

    <!-- FASE 2: Escaneo de Productos -->
    <div class="card oculto" id="fase-productos">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="font-size: 16px; color: #666;">Contenedor Activo:</span>
            <span id="mu-activo" style="font-size: 18px; background: #f0f4ff; padding: 4px 12px; border-radius: 4px; color: #3483fa; font-weight: 600;"></span>
        </div>

        <div class="form-group">
            <label>2. Escanea las Melis físicas:</label>
            <input type="text" id="input-producto" class="input-meli" placeholder="Escanea INVENTORY_ID o código universal...">
        </div>
        
        <div id="alerta-producto" class="status-text" style="min-height: 24px;"></div>
        
        <hr>
        
        <div style="display: flex; justify-content: space-between; font-size: 16px; align-items: center;">
            <span style="color: #666; font-weight: 600;">Cant. Productos pendientes:</span>
            <span id="contador" class="info-highlight" style="font-size: 20px;">0</span>
        </div>

        <!-- Lista visual de Melis -->
        <div id="contenedor-lista" style="margin-top: 16px;">
            <span style="font-size: 14px; color: #999;">IDs esperados:</span>
            <div id="lista-pendientes" class="lista-items">
                <!-- Aquí se insertan los IDs con JS -->
            </div>
        </div>

        <!-- Botón para regresar al inicio -->
        <button id="btn-reiniciar" class="btn-primary">Auditar otro MU</button>

    </div>
</div>

<script>
    let inventarioEsperado = [];

    // Función para dibujar las etiquetas de los IDs faltantes
    function actualizarListaVisual() {
        const contenedorLista = document.getElementById('lista-pendientes');
        contenedorLista.innerHTML = ''; // Limpiar lista actual
        
        inventarioEsperado.forEach(item => {
            const span = document.createElement('span');
            span.className = 'item-badge';
            span.innerText = item.INVENTORY_ID;
            contenedorLista.appendChild(span);
        });
    }

    // Función para reiniciar toda la pantalla (Volver al Inicio)
    function volverAlInicio() {
        inventarioEsperado = [];
        
        // Limpiar Fase 1
        document.getElementById('input-mu').value = '';
        document.getElementById('mensaje-sistema').innerHTML = '';
        
        // Limpiar Fase 2
        document.getElementById('input-producto').value = '';
        document.getElementById('input-producto').disabled = false;
        document.getElementById('input-producto').placeholder = "Escanea INVENTORY_ID o código universal...";
        document.getElementById('alerta-producto').innerHTML = '';
        document.getElementById('lista-pendientes').innerHTML = '';
        
        // Cambiar pantallas
        document.getElementById('fase-productos').classList.add('oculto');
        document.getElementById('fase-tote').classList.remove('oculto');
        
        // Enfocar el input del MU para mayor velocidad
        document.getElementById('input-mu').focus();
    }

    // Asignar evento al botón grande y al texto del breadcrumb
    document.getElementById('btn-reiniciar').addEventListener('click', volverAlInicio);
    document.getElementById('btn-breadcrumb').addEventListener('click', volverAlInicio);

    // FASE 1: Escaneo del MU
    document.getElementById('input-mu').addEventListener('keypress', async function(e) {
        if (e.key === 'Enter') {
            const mu = this.value.trim();
            if (!mu) return;

            document.getElementById('mensaje-sistema').innerHTML = "⏳ Consultando datos...";
            
            try {
                // ==========================================
                // NUEVA LÓGICA: Leer directamente desde GitHub
                // ==========================================
                const respuesta = await fetch('datos_totes.json?v=' + new Date().getTime());
                const todosLosDatos = await respuesta.json();

                inventarioEsperado = todosLosDatos.filter(item => item.TOTE_ID === mu);

                if (inventarioEsperado && inventarioEsperado.length > 0) {
                    document.getElementById('fase-tote').classList.add('oculto');
                    document.getElementById('fase-productos').classList.remove('oculto');
                    document.getElementById('mu-activo').innerText = mu;
                    document.getElementById('contador').innerText = inventarioEsperado.length;
                    
                    // Renderizar la lista de Melis
                    actualizarListaVisual();
                    
                    document.getElementById('input-producto').focus(); 
                } else {
                    document.getElementById('mensaje-sistema').innerHTML = "<span class='error'>No se encontraron registros para este MU.</span>";
                }
            } catch (error) {
                document.getElementById('mensaje-sistema').innerHTML = "<span class='error'>Aún no hay datos disponibles o error de carga.</span>";
            }
        }
    });

    // FASE 2: Escaneo de Meli
    document.getElementById('input-producto').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const codigoEscaneado = this.value.trim();
            this.value = ''; 
            
            const indice = inventarioEsperado.findIndex(item => 
                item.INVENTORY_ID === codigoEscaneado || item.ITE_VARIATION_ID === codigoEscaneado
            );

            const alerta = document.getElementById('alerta-producto');

            if (indice !== -1) {
                // Eliminar el producto de nuestra lista lógica
                inventarioEsperado.splice(indice, 1);
                
                // Actualizar contadores y etiquetas visuales
                document.getElementById('contador').innerText = inventarioEsperado.length;
                actualizarListaVisual();

                alerta.innerHTML = "<span class='exito'>✔️ Código verificado correctamente.</span>";
                
                if (inventarioEsperado.length === 0) {
                    alerta.innerHTML = "<span class='exito'>🎉 ¡AUDITORÍA COMPLETADA! MU sin sobrantes ni faltantes.</span>";
                    this.disabled = true; 
                    this.placeholder = "Auditoría finalizada";
                }
            } else {
                alerta.innerHTML = "<span class='error'>❌ ALERTA: Producto Cruzado (No pertenece a este MU)</span>";
            }
        }
    });
</script>

</body>
</html>
